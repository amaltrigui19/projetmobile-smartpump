name: projetmobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # UI & utils
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.0
  url_launcher: ^6.2.2
  shared_preferences: ^2.2.2
  image_picker: ^1.0.7
  path_provider: ^2.1.1
  flutter_localizations:
    sdk: flutter

  # Networking & location
  http: ^1.1.0
  geocoding: ^4.0.0
  flutter_map: ^8.2.2
  latlong2: ^0.9.1

  # Firebase
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
